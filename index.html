<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h2>Lyrics of 99 Bottles of Beer</h2> 
   <div id="display"></div>



   <script>
    for(let i = 99; i>=0; i--){
        console.log(i);
        if(i <= 99 && i>=2){
            display.innerHTML += `<p>${i} bottles of beer on the wall, ${i}bottles of beer. 
                <br> Take one down and pass it around, ${i - 1} bottles of beer on the wall.</p>`
        }else if(i == 1) {
            display.innerHTML += `<p>${i} bottle of beer on the wall,  ${i} bottle of beer. <br>
                Take one down and pass it around,  no more bottles of beer on the wall.</p>`
        }else {
             display.innerHTML += `<p>No more bottles of beer on the wall, no more bottles of beer.<br>Go to the store and buy some more, 99 bottles of beer on the wall.</p>`
        }
    }
   </script>
</body>
</html>
